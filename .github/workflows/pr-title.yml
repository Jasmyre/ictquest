# PR-title lint — enforces conventional commits on squash-merge titles.
# Release PRs (`chore(main): release x.y.z`) already satisfy this.

name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: feat|fix|perf|refactor|style|test|docs|build|ops|chore
          requireScope: false
